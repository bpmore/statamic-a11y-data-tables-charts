# The suite, on every pull request.
#
# Two PHP jobs: the newest PHP with the newest dependencies, and the oldest
# PHP the manifest allows with the oldest version of every dependency it
# allows. A floor in composer.json is a promise about a machine nobody on
# this project runs, and the only thing that makes it true is a runner that
# is that machine. When the lowest job goes red on a commit that changed
# nothing, a dependency raised its own floor, and that is the moment to
# raise ours rather than the moment a customer finds out.
#
# A third job runs the grid editor's own tests under Node: the table
# editing rules are pure functions and need no browser.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here writes to the repository, comments on a pull
# request, or touches a package registry, so it should not be able to.
permissions:
  contents: read

# A second push to the same branch cancels the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: highest
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring
          coverage: none

      # Before installing, because a malformed manifest on a published
      # package is otherwise found by Packagist, in front of an audience.
      - name: Check the manifest is well formed
        run: composer validate --strict

      # No composer.lock in this repository: this is a package an application
      # installs, so the application's lock is the one that matters. Every
      # run is a fresh resolve against the current Statamic.
      - name: Install dependencies
        if: matrix.dependencies == 'highest'
        run: composer install --prefer-dist --no-interaction --no-progress

      # `--prefer-lowest` alone would take the oldest pre-release of anything
      # that has one; with `--prefer-stable` it takes the oldest stable.
      - name: Install the oldest dependencies the manifest allows
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: ./vendor/bin/pest

  editor:
    name: Grid editor (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The grid module imports nothing, so no install is needed to test it.
      - name: Run the grid tests
        run: node --test resources/js/fieldtypes/grid.test.js
